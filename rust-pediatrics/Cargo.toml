[package]
name = "pedia_spectra_core"
version = "1.26.0"
edition = "2021"
description = "PEDIA-SPECTRA Rust DSP & Clinical Kinetics Core: 12-Pole Levinson-Durbin Infant Cry LPC Formants, Kubelka-Munk Bilirubin Inversion, AAP 2022 Bhutani Nomogram & Bateman Pharmacokinetics"
